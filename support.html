<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="theme-color" content="#000000">
  <script id="theme-bootstrap">
    (function () {
      var theme = "dark";
      try { if (localStorage.getItem("webshelf-theme") === "light") theme = "light"; } catch (_) {}
      document.documentElement.setAttribute("data-theme", theme);
      document.querySelector('meta[name="theme-color"]').setAttribute("content", theme === "light" ? "#f5f5f7" : "#000000");
    })();
  </script>

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <meta
    name="referrer"
    content="strict-origin-when-cross-origin"
  >

  <title>Support - WebShelf</title>

  <link rel="manifest" href="./manifest.webmanifest">

  <meta
    name="description"
    content="Get support for WebShelf, report broken links, website issues, incorrect information, or ask a general question."
  >

  <link rel="canonical" href="https://www.webshelf.link/support.html">
<!-- Favicon -->
  <link
    rel="icon"
    href="./images/icons/WS-Logo-192.png"
    type="image/png"
  >

  <!-- CSS -->
  <link
    rel="stylesheet"
    href="./style.css"
  >
</head>


<body>
<a class="skip-link" href="#main-content">Skip to content</a>

<!-- ==================================================
     NAVBAR
=================================================== -->

<header class="site-header">

  <nav class="container">

    <a
      href="./index.html"
      class="logo"
    >
      <img
        src="./images/icons/WS-Logo-192.png"
        alt="WebShelf Logo"
      >

      <span>WebShelf</span>
    </a>


    <div class="nav-links">

      <a
        href="./index.html"
        class="directory"
      >
        Directory
      </a>

      <a
        href="./activity.html"
        class="activity"
      >
        Activity
      </a>

      <a
        href="./support.html"
        class="support active"
      >
        Support
      </a>

      <a
        href="./suggest.html"
        class="suggest"
      >
        Suggest a site
      </a>

      <button
        class="theme-toggle"
        id="theme-toggle"
        type="button"
        aria-label="Toggle light mode"
      >
        ☀
      </button>

    </div>

  </nav>

</header>



  <!-- ==================================================
       MAIN
  =================================================== -->

  <main tabindex="-1" id="main-content" class="container">

    <section class="support-page">


      <!-- Back Link -->

      <a
        href="./index.html"
        class="back-link"
      >
        ← Back to Directory
      </a>



      <!-- Page Header -->

      <div class="support-page-header">

        <h1>
          Support
        </h1>

        <p>
          Report a problem, broken link, or ask a question about WebShelf.
        </p>

      </div>



      <!-- ==================================================
           SUPPORT FORM
      =================================================== -->

      <form
        class="support-form"
        id="support-form"
        action="https://formspree.io/f/xaeyjvkd"
        method="POST"
      >

        <input
          type="hidden"
          name="form-type"
          value="WebShelf Support"
        >


        <!-- Support Type -->

        <div class="form-group">

          <label for="support-type">
            What do you need help with?
          </label>

          <select
            id="support-type"
            name="support-type"
            required
          >

            <option value="">
              Select an option
            </option>

            <option value="broken-link">
              Broken link
            </option>

            <option value="website-bug">
              Website issue / bug
            </option>

            <option value="incorrect-information">
              Incorrect information
            </option>

            <option value="general-question">
              General question
            </option>

            <option value="other">
              Other
            </option>

          </select>

        </div>



        <!-- Related URL -->

        <div class="form-group">

          <label for="support-url">
            Related URL
          </label>

          <input
            type="url"
            id="support-url"
            name="support-url"
            placeholder="https://..."
          >

        </div>



        <!-- Message -->

        <div class="form-group">

          <label for="support-message">
            Message
          </label>

          <textarea
            id="support-message"
            name="support-message"
            rows="6"
            placeholder="Tell us what happened..."
            required
          ></textarea>

        </div>



        <!-- Submit Button -->

        <button
          type="submit"
          class="support-submit"
          id="support-submit"
        >
          Send message
        </button>



        <!-- Form Message -->

        <p
          class="form-message"
          id="support-message-status"
          aria-live="polite"
        ></p>

      </form>

    </section>

  </main>



  <!-- ==================================================
       FOOTER
  =================================================== -->

  <footer class="site-footer">

    <div class="container footer-content">

      <p>
        © 2026 WebShelf
      </p>

      <div class="footer-links">
<a href="./index.html">Directory</a>
<a href="./activity.html">Activity</a>
<a href="./support.html">Support</a>
<a href="./suggest.html">Suggest a site</a>>
</div>
</div>
</footer>



  <!-- ==================================================
       JAVASCRIPT
  =================================================== -->

  <script src="./data.js"></script>
<script src="./common.js"></script>
<script src="./support.bundle.js"></script>

</script>

<script>
  window.va =
    window.va ||
    function () {
      (window.vaq = window.vaq || []).push(arguments);
    };
</script>

<script defer src="/_vercel/insights/script.js"></script>
</body>

</html>
