<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="theme-color" content="#000000">

  <script id="theme-bootstrap">
    (function () {
      var theme = "dark";

      try {
        if (localStorage.getItem("webshelf-theme") === "light") {
          theme = "light";
        }
      } catch (_) {}

      document.documentElement.setAttribute("data-theme", theme);

      document
        .querySelector('meta[name="theme-color"]')
        .setAttribute(
          "content",
          theme === "light" ? "#f5f5f7" : "#000000"
        );
    })();
  </script>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <meta name="robots" content="noindex,follow">
  <title>404 - Page Not Found | WebShelf</title>
  <meta name="description" content="The requested WebShelf page could not be found.">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" type="image/png" href="/images/icons/WS-Logo-192.png">
  <link rel="apple-touch-icon" href="/images/icons/WS-Logo-192.png">
  <link rel="stylesheet" href="/style.css">
</head>
<body>
<a class="skip-link" href="#main-content">Skip to content</a>

<nav class="container">
<a class="logo" href="/index.html">
<img alt="WebShelf Logo" src="/images/icons/WS-Logo-192.png"/>
<span>WebShelf</span>
</a>
<div class="nav-links">
<a class="directory" href="/index.html">Directory</a>
<a class="activity" href="/activity.html">Activity</a>
<a class="support" href="/support.html">Support</a>
<a class="suggest" href="/suggest.html">Suggest a site</a>
<button aria-label="Toggle light mode" class="theme-toggle" id="theme-toggle" type="button">☀</button>
</div>
</nav>
</header>
<main id="main-content" tabindex="-1" class="container error-page">
<div class="error-card">
<p class="error-code">404</p>
<h1>Page not found</h1>
<p>The page you tried to open does not exist, was moved, or the link is incorrect.</p>
<div class="error-actions">
<a class="primary-action" href="/index.html">Back to WebShelf</a>
<a class="secondary-action" href="/support.html">Report a broken link</a>
</div>
</div>
</main>

</div>
</div>

</script>

</body>
</html>
