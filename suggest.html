<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="theme-color" content="#000000">
  <script id="theme-bootstrap">
    (function () {
      var theme = "dark";
      try { if (localStorage.getItem("webshelf-theme") === "light") theme = "light"; } catch (_) {}
      document.documentElement.setAttribute("data-theme", theme);
      document.querySelector('meta[name="theme-color"]').setAttribute("content", theme === "light" ? "#f5f5f7" : "#000000");
    })();
  </script>

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <meta
    name="referrer"
    content="strict-origin-when-cross-origin"
  >

  <title>Suggest a Site - WebShelf</title>

  <link rel="manifest" href="./manifest.webmanifest">

  <meta
    name="description"
    content="Suggest a useful website to WebShelf for review and possible inclusion in the directory."
  >

  <link rel="canonical" href="https://www.webshelf.link/suggest.html">
<!-- Favicon -->
  <link
    rel="icon"
    href="./images/icons/WS-Logo-192.png"
    type="image/png"
  >

  <!-- CSS -->
  <link
    rel="stylesheet"
    href="./style.css"
  >
</head>


<body>
<a class="skip-link" href="#main-content">Skip to content</a>

<!-- ==================================================
     NAVBAR
=================================================== -->

<header class="site-header">

  <nav class="container">

    <a
      href="./index.html"
      class="logo"
    >
      <img
        src="./images/icons/WS-Logo-192.png"
        alt="WebShelf Logo"
      >

      <span>WebShelf</span>
    </a>


    <div class="nav-links">

      <a
        href="./index.html"
        class="directory"
      >
        Directory
      </a>

      <a
        href="./activity.html"
        class="activity"
      >
        Activity
      </a>

      <a
        href="./support.html"
        class="support"
      >
        Support
      </a>

      <a
        href="./suggest.html"
        class="suggest active"
      >
        Suggest a site
      </a>

      <button
        class="theme-toggle"
        id="theme-toggle"
        type="button"
        aria-label="Toggle light mode"
      >
        ☀
      </button>

    </div>

  </nav>

</header>



  <!-- ==================================================
       MAIN
  =================================================== -->

  <main tabindex="-1" id="main-content" class="container">

    <section class="suggest-page">


      <!-- Back Link -->

      <a
        href="./index.html"
        class="back-link"
      >
        ← Back to Directory
      </a>



      <!-- Page Header -->

      <div class="suggest-page-header">

        <h1>
          Suggest a site
        </h1>

        <p>
          Know a useful website that belongs on WebShelf?
          Send it for review.
        </p>

      </div>



      <!-- ==================================================
           SUGGEST FORM
      =================================================== -->

      <form
        class="suggest-form"
        id="suggest-form"
        action="https://formspree.io/f/xaeyjvkd"
        method="POST"
      >

        <input
          type="hidden"
          name="form-type"
          value="WebShelf Suggestion"
        >


        <!-- Website URL -->

        <div class="form-group">

          <label for="site-url">
            Website URL
          </label>

          <input
            type="url"
            id="site-url"
            name="site-url"
            placeholder="https://example.com"
            required
          >

        </div>



        <!-- Category -->

        <div class="form-group">

          <label for="site-category">
            Category
          </label>

          <select
            id="site-category"
            name="site-category"
            required
          >

            <option value="">
              Select a category
            </option>

          </select>

        </div>



        <!-- Notes -->

        <div class="form-group">

          <label for="site-notes">
            Why should we add it?
          </label>

          <textarea
            id="site-notes"
            name="site-notes"
            rows="5"
            placeholder="Tell us what makes this site useful..."
          ></textarea>

        </div>



        <!-- Submit Button -->

        <button
          type="submit"
          class="suggest-submit"
          id="suggest-submit"
        >
          Submit suggestion
        </button>



        <!-- Form Message -->

        <p
          class="form-message"
          id="form-message"
          aria-live="polite"
        ></p>

      </form>

    </section>

  </main>



  <!-- ==================================================
       FOOTER
  =================================================== -->

  <footer class="site-footer">

    <div class="container footer-content">

      <p>
        © 2026 WebShelf
      </p>

      <div class="footer-links">
<a href="./index.html">Directory</a>
<a href="./activity.html">Activity</a>
<a href="./support.html">Support</a>
<a href="./suggest.html">Suggest a site</a>
</div>
</div>
</footer>



  <!-- ==================================================
       JAVASCRIPT
  =================================================== -->

  <script src="./data.js"></script>
<script src="./common.js"></script>
<script src="./suggest.bundle.js"></script>
<script>
  window.va =
    window.va ||
    function () {
      (window.vaq = window.vaq || []).push(arguments);
    };
</script>

<script defer src="/_vercel/insights/script.js"></script>
</body>

</html>
