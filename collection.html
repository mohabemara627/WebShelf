<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="theme-color" content="#000000">
  <script id="theme-bootstrap">
    (function () {
      var theme = "dark";
      try { if (localStorage.getItem("webshelf-theme") === "light") theme = "light"; } catch (_) {}
      document.documentElement.setAttribute("data-theme", theme);
      document.querySelector('meta[name="theme-color"]').setAttribute("content", theme === "light" ? "#f5f5f7" : "#000000");
    })();
  </script>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <meta name="robots" content="noindex,follow">
  <title>Collection - WebShelf</title>
  <meta id="collection-description" name="description" content="Browse a curated WebShelf collection.">
  <link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./images/icons/WS-Logo-192.png" type="image/png">
  <link rel="stylesheet" href="./style.css">
</head>
<body>
<a class="skip-link" href="#main-content">Skip to content</a>
  <header class="site-header">
    <nav class="container">
      <a href="./index.html" class="logo"><img src="./images/icons/WS-Logo-192.png" alt="WebShelf Logo"><span>WebShelf</span></a>
      <div class="nav-links">
        <a href="./index.html" class="directory active">Directory</a>
        <a href="./activity.html" class="activity">Activity</a>
        <a href="./support.html" class="support">Support</a>
        <a href="./suggest.html" class="suggest">Suggest a site</a>
        <button class="theme-toggle" id="theme-toggle" type="button" aria-label="Toggle light mode">☀</button>
      </div>
    </nav>
  </header>

  <main tabindex="-1" id="main-content" class="container">
    <section class="category-page collection-page">
      <a href="./index.html" class="back-link">← Back to Directory</a>
      <div class="category-page-header">
        <div class="category-page-icon" id="collection-page-icon"><i data-lucide="layers-3"></i></div>
        <div>
          <p class="activity-eyebrow">Collection</p>
          <h1 id="collection-page-title">Collection</h1>
          <p id="collection-page-count" role="status" aria-live="polite" aria-atomic="true">0 sites</p>
        </div>
      </div>
      <div class="site-filter-bar" id="collection-site-filters" aria-label="Filter collection"></div>
      <div class="category-page-list" id="collection-page-list" aria-live="polite" aria-busy="false"></div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="container footer-content">
      <p>© 2026 WebShelf</p>
      <div class="footer-links">
<a href="./index.html">Directory</a>
<a href="./activity.html">Activity</a>
<a href="./support.html">Support</a>
<a href="./suggest.html">Suggest a site</a>
</div>
</div>
</footer>

  <script src="./data.js"></script>
<script src="./common.js"></script>
<script src="./collection.bundle.js"></script>
<script>
  window.va =
    window.va ||
    function () {
      (window.vaq = window.vaq || []).push(arguments);
    };
</script>

<script defer src="/_vercel/insights/script.js"></script>
</body>
</html>
