<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="theme-color" content="#000000">
  <script id="theme-bootstrap">
    (function () {
      var theme = "dark";
      try { if (localStorage.getItem("webshelf-theme") === "light") theme = "light"; } catch (_) {}
      document.documentElement.setAttribute("data-theme", theme);
      document.querySelector('meta[name="theme-color"]').setAttribute("content", theme === "light" ? "#f5f5f7" : "#000000");
    })();
  </script>

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <meta
    name="referrer"
    content="strict-origin-when-cross-origin"
  >

  <title>Category - WebShelf</title>
  <link rel="manifest" href="./manifest.webmanifest">

  <meta
    id="category-description"
    name="description"
    content="Browse curated websites by category on WebShelf."
  >
    <link
      id="category-canonical"
      rel="canonical"
    >
<!-- Favicon -->
  <link
    rel="icon"
    href="./images/icons/WS-Logo-192.png"
    type="image/png"
  >


  <!-- CSS -->
  <link
    rel="stylesheet"
    href="./style.css"
  >
</head>


<body>
<a class="skip-link" href="#main-content">Skip to content</a>

<!-- ==================================================
     NAVBAR
=================================================== -->

<header class="site-header">

  <nav class="container">

    <a
      href="./index.html"
      class="logo"
    >
      <img
        src="./images/icons/WS-Logo-192.png"
        alt="WebShelf Logo"
      >

      <span>WebShelf</span>
    </a>


    <div class="nav-links">

      <a
        href="./index.html"
        class="directory active"
      >
        Directory
      </a>

      <a
        href="./activity.html"
        class="activity"
      >
        Activity
      </a>

      <a
        href="./support.html"
        class="support"
      >
        Support
      </a>

      <a
        href="./suggest.html"
        class="suggest"
      >
        Suggest a site
      </a>

      <button
        class="theme-toggle"
        id="theme-toggle"
        type="button"
        aria-label="Toggle light mode"
      >
        ☀
      </button>

    </div>

  </nav>

</header>



  <!-- ==================================================
       MAIN
  =================================================== -->

  <main tabindex="-1" id="main-content" class="container">

    <section class="category-page">


      <!-- Back Link -->

      <a
        href="./index.html"
        class="back-link"
      >
        ← Back to Directory
      </a>



      <!-- Category Header -->

      <div class="category-page-header">

        <div
          class="category-page-icon"
          id="category-page-icon"
        >
          <i
            data-lucide="folder"
            id="category-page-lucide"
          ></i>
        </div>


      <div>

        <h1 id="category-page-title">
          Category
        </h1>

        <p id="category-page-count">
          0 sites
        </p>

        <p
          id="category-page-description"
          class="category-page-description"
        ></p>

      </div>

      </div>



      <!-- Category filters -->

      <div
        class="site-filter-bar"
        id="category-site-filters"
        aria-label="Filter sites in this category"
      ></div>

      <!-- Category Sites -->

      <div
        class="category-page-list"
        id="category-page-list"
      ></div>

    </section>

  </main>

<footer class="site-footer">
  <div class="container footer-content">

    <p>
      © 2026 WebShelf
    </p>

<div class="footer-links">

        <a href="./index.html">
          Directory
        </a>

        <a href="./activity.html">
          Activity
        </a>

        <a href="./support.html">
          Support
        </a>

        <a href="./suggest.html">
          Suggest a site
        </a>

      </div>

  </div>
</footer>

  <!-- ==================================================
       SCRIPTS
  =================================================== -->

  <script src="./data.js"></script>
<script src="./common.js"></script>
<script src="./category.bundle.js"></script>
</body>

</html>
