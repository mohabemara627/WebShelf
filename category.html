<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <meta
    name="referrer"
    content="strict-origin-when-cross-origin"
  >

  <title>Category - WebShelf</title>
  <link rel="manifest" href="./manifest.webmanifest">
  <meta name="theme-color" content="#000000">

  <meta
    id="category-description"
    name="description"
    content="Browse curated websites by category on WebShelf."
  >
  <link
    id="category-canonical"
    rel="canonical"
    href="https://www.webshelf.link/category.html"
  >
<!-- Favicon -->
  <link
    rel="icon"
    href="./images/icons/WS-Logo.png"
    type="image/png"
  >


  <!-- CSS -->
  <link
    rel="stylesheet"
    href="./style.css"
  >
</head>


<body>

<!-- ==================================================
     NAVBAR
=================================================== -->

<header class="site-header">

  <nav class="container">

    <a
      href="./index.html"
      class="logo"
    >
      <img
        src="./images/icons/WS-Logo.png"
        alt="WebShelf Logo"
      >

      <span>WebShelf</span>
    </a>


    <div class="nav-links">

      <a
        href="./index.html"
        class="directory active"
      >
        Directory
      </a>

      <a
        href="./activity.html"
        class="activity"
      >
        Activity
      </a>

      <a
        href="./support.html"
        class="support"
      >
        Support
      </a>

      <a
        href="./suggest.html"
        class="suggest"
      >
        Suggest a site
      </a>

      <button
        class="theme-toggle"
        id="theme-toggle"
        type="button"
        aria-label="Toggle light mode"
      >
        ☀
      </button>

    </div>

  </nav>

</header>



  <!-- ==================================================
       MAIN
  =================================================== -->

  <main class="container">

    <section class="category-page">


      <!-- Back Link -->

      <a
        href="./index.html"
        class="back-link"
      >
        ← Back to Directory
      </a>



      <!-- Category Header -->

      <div class="category-page-header">

        <div
          class="category-page-icon"
          id="category-page-icon"
        >
          <i
            data-lucide="folder"
            id="category-page-lucide"
          ></i>
        </div>


        <div>

          <h1 id="category-page-title">
            Category
          </h1>

          <p id="category-page-count">
            0 sites
          </p>

        </div>

      </div>



      <!-- Category filters -->

      <div
        class="site-filter-bar"
        id="category-site-filters"
        aria-label="Filter sites in this category"
      ></div>

      <!-- Category Sites -->

      <div
        class="category-page-list"
        id="category-page-list"
      ></div>

    </section>

  </main>

<footer class="site-footer">
  <div class="container footer-content">

    <p>
      © 2026 WebShelf
    </p>

<div class="footer-links">

        <a href="./index.html">
          Directory
        </a>

        <a href="./activity.html">
          Activity
        </a>

        <a href="./support.html">
          Support
        </a>

        <a href="./suggest.html">
          Suggest a site
        </a>

      </div>

  </div>
</footer>

  <!-- ==================================================
       SCRIPTS
  =================================================== -->

  <script src="./icons.js"></script>
  <script src="./data.js"></script>
  <script src="./hidden.js"></script>
  <script src="./dialogs.js"></script>
  <script src="./favorites.js"></script>
  <script src="./recently-viewed.js"></script>
  <script src="./category.js"></script>
  <script src="./preview.js"></script>
  <script src="./badge-filters.js"></script>
  <script src="./search.js"></script>
  <script src="./navigation.js"></script>
  <script src="./shortcuts.js"></script>
  <script src="./theme.js"></script>
  <script src="./pwa.js"></script>

  <script>
    if (window.lucide) {
      lucide.createIcons();
    }
  </script>

</body>

</html>
