<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Category - WebShelf</title>
<meta
  name="description"
  content="Browse curated websites by category on WebShelf."
>

  <!-- Google Font -->
  <link
    rel="preconnect"
    href="https://fonts.googleapis.com"
  >

  <link
    rel="preconnect"
    href="https://fonts.gstatic.com"
    crossorigin
  >

  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
    rel="stylesheet"
  >


  <!-- Favicon -->
  <link
    rel="icon"
    href="/images/WebShelf/WS-Logo.png"
    type="image/png"
  >


  <!-- CSS -->
  <link
    rel="stylesheet"
    href="./style.css"
  >
</head>


<body>

  <!-- ==================================================
       NAVBAR
  =================================================== -->

  <header>

    <nav class="container">

      <a
        href="./index.html"
        class="logo"
      >
        <img
          src="/images/WebShelf/WS-Logo.png"
          alt="WebShelf Logo"
        >

        <span>WebShelf</span>
      </a>


<div class="nav-links">

  <a
    href="./index.html"
    class="directory active"
  >
    Directory
  </a>

  <a
    href="./support.html"
    class="support"
  >
    Support
  </a>

  <a
    href="./suggest.html"
    class="suggest"
  >
    Suggest a site
  </a>

  <button
    class="theme-toggle"
    id="theme-toggle"
    type="button"
    aria-label="Toggle light mode"
  >
    ☀
  </button>

</div>
    </nav>

  </header>



  <!-- ==================================================
       MAIN
  =================================================== -->

  <main class="container">

    <section class="category-page">


      <!-- Back Link -->

      <a
        href="./index.html"
        class="back-link"
      >
        ← Back to Directory
      </a>



      <!-- Category Header -->

      <div class="category-page-header">

        <div
          class="category-page-icon"
          id="category-page-icon"
        >
          <i
            data-lucide="folder"
            id="category-page-lucide"
          ></i>
        </div>


        <div>

          <h1 id="category-page-title">
            Category
          </h1>

          <p id="category-page-count">
            0 sites
          </p>

        </div>

      </div>



      <!-- Category Sites -->

      <div
        class="category-page-list"
        id="category-page-list"
      ></div>

    </section>

  </main>

<footer class="site-footer">
  <div class="container footer-content">

    <p>
      © 2026 WebShelf
    </p>

<div class="footer-links">

  <a href="./index.html">
    Directory
  </a>

  <a href="./support.html">
    Support
  </a>

  <a href="./suggest.html">
    Suggest a site
  </a>

</div>

  </div>
</footer>

  <!-- ==================================================
       SCRIPTS
  =================================================== -->

  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <!-- WebShelf Data -->
  <script src="./data.js"></script>

  <!-- Category Page JavaScript -->
  <script src="./category.js"></script>
  <script src="./theme.js"></script>

</body>

</html>
